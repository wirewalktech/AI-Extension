title: Wirewalk AI
tagline: AI adoption and infrastructure
description: >-
  AI adoption, private AI deployments, GPU infrastructure and performance diagnostics.
  From selecting a useful first application to building and operating the system.
author: Wirewalk AI
url: https://ai.wirewalk.com
# Served at the root of ai.wirewalk.com (see CNAME). A non-empty baseurl
# makes every Liquid-generated link 404 on the live domain.
baseurl: ""
permalink: /writing/:title/
timezone: America/New_York
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: article }
exclude:
  # Was live at /README-admin.md. No credentials in it, but it published the
  # private repo path and the OAuth setup procedure. `README.md` was excluded --
  # a file that does not exist.
  - README-admin.md
  - make_docs.py
  - make_logo.py
  # Generates industries/ from the portal worker's data files. Not a page.
  - make_industries.mjs
  # Layout regression checker. Tooling, not content.
  - tools
  - wirewalk-ai_3.html
  - README.md

# Generates /sitemap.xml at build time. On the GitHub Pages allowlist,
# so no Gemfile change and no build mode change is needed.
plugins:
  - jekyll-sitemap
