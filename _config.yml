title: Wirewalk AI
tagline: The Operating Review
description: >-
  Field notes on operating performance: where value leaks across finance, IT,
  compliance, contracts and delivery, and what it costs to leave it there.
author: Wirewalk AI
url: https://ai.wirewalk.com
# Served at the root of ai.wirewalk.com (see CNAME). A non-empty baseurl
# makes every Liquid-generated link 404 on the live domain.
baseurl: ""
permalink: /writing/:title/
timezone: America/New_York
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: article }
exclude:
  # Was live at /README-admin.md. No credentials in it, but it published the
  # private repo path and the OAuth setup procedure. `README.md` was excluded --
  # a file that does not exist.
  - README-admin.md
  - make_docs.py
  - make_logo.py
  # Generates industries/ from the portal worker's data files. Not a page.
  - make_industries.mjs
  # Layout regression checker. Tooling, not content.
  - tools
  - wirewalk-ai_3.html
  - README.md
