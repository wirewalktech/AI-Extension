<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title }} — Wirewalk AI</title>
<meta name="description" content="{{ page.summary | default: site.description | strip_newlines | truncate: 180 }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/favicon-180.png' | relative_url }}">
<style>
:root{
  --bg:#FAF9F5; --alt:#F4F2EC; --ln:#E4E0D5; --ln2:#D5D0C0;
  --tx:#1F1E1D; --tx2:#5C5A54; --tx3:#8A8781;
  --ac:#D97757; --ac2:#C2603F;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);
     font-size:17px;line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:0 clamp(20px,5vw,32px)}
header.top{border-bottom:1px solid var(--ln);padding:22px 0;margin-bottom:44px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--tx);font-weight:600}
.mark{width:21px;height:21px;flex:0 0 21px;display:grid;
      grid-template:repeat(2,1fr)/repeat(2,1fr);gap:2.5px}
.mark i{background:var(--ac);border-radius:1.5px;transform:scale(.84)}
.mark i:nth-child(4){background:transparent;box-shadow:inset 0 0 0 1.8px var(--ac)}
.brand s{text-decoration:none;color:var(--tx3);font-weight:500;margin-left:6px}
.back{float:right;font-size:14px;color:var(--tx2);text-decoration:none}
.back:hover{color:var(--ac)}
article h1{font-size:clamp(28px,5vw,38px);line-height:1.16;letter-spacing:-.02em;margin:0 0 14px}
.meta{color:var(--tx3);font-size:14px;margin-bottom:8px;letter-spacing:.02em}
.summary{color:var(--tx2);font-size:18.5px;line-height:1.55;margin:0 0 34px;
         padding-bottom:26px;border-bottom:1px solid var(--ln)}
article h2{font-size:22px;letter-spacing:-.01em;margin:38px 0 12px}
article h3{font-size:18px;margin:28px 0 8px}
article p{margin:0 0 18px}
article ul,article ol{padding-left:22px;margin:0 0 18px}
article li{margin:6px 0}
article a{color:var(--ac2);text-underline-offset:2px}
article blockquote{margin:24px 0;padding:2px 0 2px 20px;border-left:2px solid var(--ac);
                   color:var(--tx2)}
article code{font-family:var(--mono);font-size:.88em;background:var(--alt);
             padding:2px 6px;border-radius:4px}
article pre{background:var(--alt);border:1px solid var(--ln);border-radius:8px;
            padding:16px 18px;overflow-x:auto}
article pre code{background:none;padding:0}
article table{width:100%;border-collapse:collapse;margin:0 0 20px;font-size:15.5px;
              display:block;overflow-x:auto}
article th,article td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--ln)}
article th{color:var(--tx3);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
article img{max-width:100%;height:auto;border-radius:8px}
.tags{margin:36px 0 0;padding-top:22px;border-top:1px solid var(--ln)}
.tag{display:inline-block;font-size:12.5px;color:var(--tx2);background:var(--alt);
     border:1px solid var(--ln);border-radius:20px;padding:3px 11px;margin:0 6px 6px 0}
footer.end{margin:56px 0 40px;padding-top:24px;border-top:1px solid var(--ln);
           color:var(--tx3);font-size:14px}
footer.end a{color:var(--ac2)}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}">
    <span class="mark"><i></i><i></i><i></i><i></i></span>
    <span>Wirewalk<s>AI</s></span>
  </a>
  <a class="back" href="{{ '/writing/' | relative_url }}">All notes</a>
</div></header>

<div class="wrap"><article>
  <p class="meta">{{ page.date | date: "%-d %B %Y" }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.summary %}<p class="summary">{{ page.summary }}</p>{% endif %}
  {{ content }}
  {% if page.tags and page.tags.size > 0 %}
  <div class="tags">{% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}</div>
  {% endif %}
</article>

<footer class="end">
  <a href="{{ '/writing/' | relative_url }}">← All notes</a> ·
  <a href="{{ '/' | relative_url }}">The Operating Review</a>
</footer>
</div>
</body></html>
